[project]
name = "sx-view"
version = "0.1.0"
description = "Viewer of shorelinerx waterlines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pystac>=1.15.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
editing = "sx_view.cli.app:app"
